name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Organize Project Structure
      run: |
        mkdir -p app/src/main/java/com/poojamobiles/cutter app/src/main/res/layout
        if [ -f "MainActivity.java" ]; then mv MainActivity.java app/src/main/java/com/poojamobiles/cutter/; fi
        if [ -f "activity_main.xml" ]; then mv activity_main.xml app/src/main/res/layout/; fi
        if [ -f "AndroidManifest.xml" ]; then mv AndroidManifest.xml app/src/main/; fi

        # Create app level build.gradle without conflicting repositories block
        if [ ! -f "app/build.gradle" ]; then
          printf "plugins {\n    id 'com.android.application'\n}\n\nandroid {\n    compileSdk 33\n    defaultConfig {\n        applicationId 'com.poojamobiles.cutter'\n        minSdk 21\n        targetSdk 33\n        versionCode 1\n        versionName '1.0'\n    }\n}\n\ndependencies {\n    implementation 'androidx.appcompat:appcompat:1.6.1'\n}\n" > app/build.gradle
        fi

    - name: Create Clean Gradle Settings
      run: |
        printf "pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\n" > settings.gradle
        printf "include ':app'\n" >> settings.gradle
        printf "dependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n" >> settings.gradle
        
        echo "" > build.gradle

        mkdir -p gradle/wrapper
        echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties

    - name: Build Debug APK with Gradle
      run: |
        gradle wrapper
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
